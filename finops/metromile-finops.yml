optimization_notes:
  - Metromile consumer insurance rewards low-mileage drivers; drivers under ~10,000 miles/year typically see the greatest savings relative to traditional premiums.
  - The daily mileage cap (250 miles; 150 in NJ) limits worst-case daily cost, providing predictability for higher-mileage days such as road trips.
  - Enterprise buyers should negotiate SLA, API throughput, and data retention terms as part of the master agreement since no public pricing sheet exists.
  - Following the Lemonade acquisition (July 2022), enterprise contract inquiries may be routed through Lemonade's enterprise channel.
