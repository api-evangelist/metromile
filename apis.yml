aid: metromile
name: Metromile
description: >
  Metromile is a pay-per-mile auto insurance platform powered by telematics
  and data science. Customers attach the Pulse OBD device to their vehicle
  to track mileage; premiums consist of a base monthly rate plus a per-mile
  charge, rewarding low-mileage drivers with significant savings. Beyond
  consumer insurance, Metromile Enterprise offers a cloud-based REST API
  platform for property and casualty insurers covering touchless claims
  automation, accident reconstruction (Replay), fraud detection (Detect),
  digital FNOL reporting (Report), and back-office workflow automation
  (Streamline). Metromile was acquired by Lemonade in July 2022.
